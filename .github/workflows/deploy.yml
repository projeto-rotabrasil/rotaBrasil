name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # O build confere os tipos (tsc) antes de gerar o site.
      # A chave da OpenTripMap é opcional: sem ela, as atrações próximas vêm da Wikipédia.
      - name: Build
        run: npm run build
        env:
          VITE_OPENTRIPMAP_KEY: ${{ secrets.VITE_OPENTRIPMAP_KEY }}

      # O GitHub Pages não tem "fallback" de SPA: ao recarregar /destino/maragogi ele
      # devolveria 404. Servir o index.html como 404.html faz o React Router assumir a rota.
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
